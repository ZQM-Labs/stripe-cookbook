name: Cookbook tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/01-verified-checkout
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stripe_cookbook_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stripe_cookbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Run PostgreSQL integration tests against disposable service
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/stripe_cookbook_test
          STRIPE_COOKBOOK_PG_TEST: "1"
        run: node --test postgres-store.integration.test.js
