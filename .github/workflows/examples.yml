name: Cookbook tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webhook-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/01-verified-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
